<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>milo-pet 设置</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 20px;
        color: #222;
      }
      label {
        display: block;
        margin: 10px 0;
      }
      input,
      select {
        width: 120px;
        padding: 4px;
      }
      button {
        margin-top: 12px;
        padding: 6px 16px;
      }
      #status {
        color: #0a7;
        margin-left: 10px;
      }
    </style>
  </head>
  <body>
    <h2>milo-pet 设置</h2>
    <form id="form">
      <label>宽度（逻辑像素）<input id="width" type="number" min="50" max="1000" step="1" /></label>
      <label>
        初始角落
        <select id="corner">
          <option value="top-right">右上</option>
          <option value="top-left">左上</option>
          <option value="bottom-right">右下</option>
          <option value="bottom-left">左下</option>
        </select>
      </label>
      <label>水平边距 <input id="margin_x" type="number" step="1" /></label>
      <label>垂直边距 <input id="margin_y" type="number" step="1" /></label>
      <label>空闲入睡（秒，0=关闭）<input id="sleep_after" type="number" min="0" step="1" /></label>
      <button type="submit">保存</button>
      <span id="status"></span>
    </form>
    <script>
      const invoke = window.__TAURI__.core.invoke;
      let current = null;

      function fill(cfg) {
        current = cfg;
        document.getElementById("width").value = cfg.width;
        document.getElementById("corner").value = cfg.corner;
        document.getElementById("margin_x").value = cfg.margin_x;
        document.getElementById("margin_y").value = cfg.margin_y;
        document.getElementById("sleep_after").value = cfg.sleep_after;
      }

      invoke("get_config")
        .then(fill)
        .catch((e) => {
          document.getElementById("status").textContent = "读取失败: " + e;
        });

      document.getElementById("form").addEventListener("submit", (e) => {
        e.preventDefault();
        if (!current) return;
        current.width = parseFloat(document.getElementById("width").value);
        current.corner = document.getElementById("corner").value;
        current.margin_x = parseFloat(document.getElementById("margin_x").value);
        current.margin_y = parseFloat(document.getElementById("margin_y").value);
        current.sleep_after = parseFloat(document.getElementById("sleep_after").value);
        invoke("set_config", { cfg: current })
          .then(() => {
            document.getElementById("status").textContent = "已保存（重启后生效）";
          })
          .catch((err) => {
            document.getElementById("status").textContent = "保存失败: " + err;
          });
      });
    </script>
  </body>
</html>
