[package]
name = "milo-pet-tauri"
version = "0.2.0"
edition = "2021"
description = "milo-pet desktop pet (Tauri shell)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
pet-core = { path = "../crates/pet-core" }
pet-render = { path = "../crates/pet-render" }
pet_app = { path = "../crates/pet-app", package = "milo-pet" }
